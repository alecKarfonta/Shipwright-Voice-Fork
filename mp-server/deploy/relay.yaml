apiVersion: v1
kind: Namespace
metadata:
  name: z64
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: z64
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: z64-relay}
  template:
    metadata:
      labels: {app: z64-relay}
    spec:
      imagePullSecrets:
      - name: relay-registry
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: relay
        image: 192.168.50.78:30500/z64/relay:20261013.3
        imagePullPolicy: IfNotPresent
        ports:
        - {name: http, containerPort: 8080}
        resources:
          requests: {cpu: 50m, memory: 32Mi}
          limits: {cpu: '1', memory: 256Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ['ALL']}
        readinessProbe:
          httpGet: {path: /readyz, port: http}
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /healthz, port: http}
          initialDelaySeconds: 5
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: relay
  namespace: z64
spec:
  selector: {app: z64-relay}
  ports:
  - {name: http, port: 8080, targetPort: http}
