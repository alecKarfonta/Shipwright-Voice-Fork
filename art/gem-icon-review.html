<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forge gem art</title>
<style>
:root{--size:96px;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#141b31;color:#eee9d8;font:16px system-ui,sans-serif;padding:28px;max-width:1120px;margin:auto}h1{font:30px Georgia,serif;margin:0 0 8px;color:#f4dda3}p{color:#aab6d0;margin:0 0 22px}header{display:flex;justify-content:space-between;gap:24px;align-items:center}nav{display:flex;gap:8px;align-items:center}button,select{background:#2a3856;border:1px solid #7184a6;border-radius:6px;color:#fff;padding:9px;font:inherit}section{display:grid;grid-template-columns:95px 1fr;align-items:center;margin:14px 0;gap:18px}h2{font:22px Georgia,serif;color:#dbc687}.gems{display:grid;grid-template-columns:repeat(6,minmax(100px,1fr));gap:10px}figure{margin:0;background:#1c2841;border:1px solid #526283;border-radius:8px;display:flex;align-items:center;flex-direction:column;padding:14px 2px 12px}img{width:var(--size);height:var(--size);object-fit:contain}figcaption{font-size:14px;margin-top:10px}.gray img{filter:grayscale(1)}button[aria-pressed="true"]{color:#ffeb9d;border-color:#e6ca7f}@media(max-width:850px){body{padding:18px}.gems{grid-template-columns:repeat(3,1fr)}header{display:block}nav{margin-top:14px}section{grid-template-columns:72px 1fr}}
</style><header><div><h1>The forge / Gem collection</h1><p>Six families. Three visibly different grades.</p></div><nav><button id="gray" aria-pressed="false">Grayscale</button><label>Size <select id="size"><option value="48">48 px</option><option value="80">80 px</option><option value="96" selected>96 px</option><option value="128">128 px</option></select></label></nav></header><section><h2>Rough</h2><div class="gems"><figure><img src="../soh/assets/custom/textures/arpg/gems/rough-ruby.png" alt="Rough Ruby"><figcaption>Ruby</figcaption></figure><figure><img src="../soh/assets/custom/textures/arpg/gems/rough-sapphire.png" alt="Rough Sapphire"><figcaption>Sapphire</figcaption></figure><figure><img src="../soh/assets/custom/textures/arpg/gems/rough-topaz.png" alt="Rough Topaz"><figcaption>Topaz</figcaption></figure><figure><img src="../soh/assets/custom/textures/arpg/gems/rough-emerald.png" alt="Rough Emerald"><figcaption>Emerald</figcaption></figure><figure><img src="../soh/assets/custom/textures/arpg/gems/rough-amethyst.png" alt="Rough Amethyst"><figcaption>Amethyst</figcaption></figure><figure><img src="../soh/assets/custom/textures/arpg/gems/rough-diamond.png" alt="Rough Diamond"><figcaption>Diamond</figcaption></figure></div></section><section><h2>Cut</h2><div class="gems"><figure><img src="../soh/assets/custom/textures/arpg/gems/cut-ruby.png" alt="Cut Ruby"><figcaption>Ruby</figcaption></figure><figure><img src="../soh/assets/custom/textures/arpg/gems/cut-sapphire.png" alt="Cut Sapphire"><figcaption>Sapphire</figcaption></figure><figure><img src="../soh/assets/custom/textures/arpg/gems/cut-topaz.png" alt="Cut Topaz"><figcaption>Topaz</figcaption></figure><figure><img src="../soh/assets/custom/textures/arpg/gems/cut-emerald.png" alt="Cut Emerald"><figcaption>Emerald</figcaption></figure><figure><img src="../soh/assets/custom/textures/arpg/gems/cut-amethyst.png" alt="Cut Amethyst"><figcaption>Amethyst</figcaption></figure><figure><img src="../soh/assets/custom/textures/arpg/gems/cut-diamond.png" alt="Cut Diamond"><figcaption>Diamond</figcaption></figure></div></section><section><h2>Perfect</h2><div class="gems"><figure><img src="../soh/assets/custom/textures/arpg/gems/perfect-ruby.png" alt="Perfect Ruby"><figcaption>Ruby</figcaption></figure><figure><img src="../soh/assets/custom/textures/arpg/gems/perfect-sapphire.png" alt="Perfect Sapphire"><figcaption>Sapphire</figcaption></figure><figure><img src="../soh/assets/custom/textures/arpg/gems/perfect-topaz.png" alt="Perfect Topaz"><figcaption>Topaz</figcaption></figure><figure><img src="../soh/assets/custom/textures/arpg/gems/perfect-emerald.png" alt="Perfect Emerald"><figcaption>Emerald</figcaption></figure><figure><img src="../soh/assets/custom/textures/arpg/gems/perfect-amethyst.png" alt="Perfect Amethyst"><figcaption>Amethyst</figcaption></figure><figure><img src="../soh/assets/custom/textures/arpg/gems/perfect-diamond.png" alt="Perfect Diamond"><figcaption>Diamond</figcaption></figure></div></section><script>document.querySelector('#gray').onclick=function(){const value=document.body.classList.toggle('gray');this.setAttribute('aria-pressed',value)};document.querySelector('#size').onchange=function(){document.documentElement.style.setProperty('--size',this.value+'px')};</script></html>
